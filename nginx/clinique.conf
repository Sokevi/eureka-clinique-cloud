server {
    listen 80;
    server_name eurekaclinique.app;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://eurekaclinique.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eurekaclinique.app;

    ssl_certificate /etc/letsencrypt/live/eurekaclinique.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eurekaclinique.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}